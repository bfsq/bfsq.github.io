<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181b" media="(prefers-color-scheme: dark)">
<title>链接聚合</title>
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --text: #22252a;
    --muted: #6b7078;
    --line: #e1e2dd;
    --accent: #2f5bea;
    --accent-text: #ffffff;
    --b0: #dfe7ff; --b0t: #2a4bc4;
    --b1: #ffe8d2; --b1t: #a8530f;
    --b2: #d9f3e6; --b2t: #1b7a4f;
    --b3: #f5e1f5; --b3t: #8a2f8a;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181b;
      --surface: #202226;
      --text: #e8e9ec;
      --muted: #9aa0a9;
      --line: #2e3136;
      --accent: #7f9bff;
      --accent-text: #0e1530;
      --b0: #26305a; --b0t: #a9bcff;
      --b1: #4a3320; --b1t: #ffc690;
      --b2: #1f3f31; --b2t: #8fe0b8;
      --b3: #432a43; --b3t: #efb3ef;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.5;
    padding: 36px 16px 56px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(56px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 820px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 1.45rem; margin: 0; }
  .count { color: var(--muted); font-size: .88rem; }
  .search {
    width: 100%;
    font: inherit;
    font-size: 16px;
    min-height: 44px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 22px;
    -webkit-appearance: none;
    appearance: none;
  }
  .search:focus, .btn:focus-visible, .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  h2 { font-size: .95rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  section { margin-bottom: 26px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 620px) {
    body { padding-top: 24px; }
    .grid { grid-template-columns: 1fr; }
    .card { padding: 12px 14px; gap: 12px; }
    .title { white-space: normal; }
    .desc {
      white-space: normal;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .btn { padding: 9px 16px; font-size: .9rem; }
  }

  .card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    text-decoration: none;
    color: inherit;
  }
  .card { min-height: 64px; }
  .card:active { border-color: var(--accent); background: var(--bg); }
  @media (hover: hover) {
    .card:hover { border-color: var(--accent); }
  }
  .badge {
    flex: none;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    border-radius: 8px;
    font-weight: 700;
    background: var(--bg-c);
    color: var(--fg-c);
  }
  .body { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: .96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { color: var(--muted); font-size: .84rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .path { color: var(--muted); font-size: .76rem; font-family: ui-monospace, Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn {
    flex: none;
    font-size: .85rem;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 6px;
    padding: 5px 14px;
  }
  .empty { color: var(--muted); text-align: center; padding: 28px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>链接聚合</h1>
    <span class="count" id="count"></span>
  </header>

  <input class="search" id="q" type="search" placeholder="搜索名称、说明或路径" aria-label="搜索链接">

  <div id="root"></div>
</main>

<script>
  // 在这里增删链接。url 可以是相对路径(如 /aria2)或完整网址。
  // group 用来分组;color 可选 0–3,不写则按顺序轮换。
  var LINKS = [
    {
      group: "下载工具",
      title: "aria2 下载命令生成器",
      desc: "粘贴链接,自动生成并复制 aria2c 命令",
      url: "/aria2",
      button: "打开"
    }
  ];

  var root = document.getElementById('root');
  var countEl = document.getElementById('count');
  var q = document.getElementById('q');

  function render() {
    var kw = q.value.trim().toLowerCase();
    var groups = [], map = {}, shown = 0;

    LINKS.forEach(function (l, i) {
      var hay = (l.title + ' ' + (l.desc || '') + ' ' + l.url).toLowerCase();
      if (kw && hay.indexOf(kw) === -1) return;
      var g = l.group || '其他';
      if (!map[g]) { map[g] = []; groups.push(g); }
      map[g].push({ l: l, i: i });
      shown++;
    });

    root.textContent = '';
    countEl.textContent = kw ? ('找到 ' + shown + ' / ' + LINKS.length + ' 个') : ('共 ' + LINKS.length + ' 个链接');

    if (!shown) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = kw ? '没有匹配的链接,换个关键词试试。' : '还没有链接,请在 LINKS 列表里添加。';
      root.appendChild(e);
      return;
    }

    groups.forEach(function (g) {
      var sec = document.createElement('section');
      var h = document.createElement('h2');
      h.textContent = g;
      sec.appendChild(h);
      var grid = document.createElement('div');
      grid.className = 'grid';

      map[g].forEach(function (o) {
        var l = o.l;
        var c = (typeof l.color === 'number' ? l.color : o.i) % 4;
        var a = document.createElement('a');
        a.className = 'card';
        a.href = l.url;
        a.style.setProperty('--bg-c', 'var(--b' + c + ')');
        a.style.setProperty('--fg-c', 'var(--b' + c + 't)');

        var badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = (l.title || '?').charAt(0).toUpperCase();

        var body = document.createElement('div');
        body.className = 'body';
        var t = document.createElement('div');
        t.className = 'title';
        t.textContent = l.title;
        body.appendChild(t);
        if (l.desc) {
          var d = document.createElement('div');
          d.className = 'desc';
          d.textContent = l.desc;
          body.appendChild(d);
        }
        var p = document.createElement('div');
        p.className = 'path';
        p.textContent = l.url;
        body.appendChild(p);

        var b = document.createElement('span');
        b.className = 'btn';
        b.textContent = l.button || '打开';

        a.appendChild(badge);
        a.appendChild(body);
        a.appendChild(b);
        grid.appendChild(a);
      });

      sec.appendChild(grid);
      root.appendChild(sec);
    });
  }

  q.addEventListener('input', render);
  render();
</script>
</body>
</html>
