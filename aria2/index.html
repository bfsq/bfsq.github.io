<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
<title>aria2 下载命令生成器</title>
<style>
  :root {
    --bg: #f3f5f4;
    --surface: #ffffff;
    --text: #1b2421;
    --muted: #5d6b66;
    --line: #d5dcd9;
    --accent: #0f766e;
    --accent-text: #ffffff;
    --code-bg: #14201c;
    --code-text: #d7f5e6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101614;
      --surface: #19211e;
      --text: #e6ede9;
      --muted: #93a39c;
      --line: #2c3833;
      --accent: #2dd4bf;
      --accent-text: #06201c;
      --code-bg: #0a0f0d;
      --code-text: #d7f5e6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    line-height: 1.6;
    padding: 24px 16px 48px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
    padding-bottom: max(48px, env(safe-area-inset-bottom));
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  textarea, input[type="text"], input[type="number"] {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
  }
  textarea { min-height: 96px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; word-break: break-all; }
  textarea:focus, input:focus, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field { margin-top: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  @media (max-width: 520px) {
    body { padding-top: 18px; }
    h1 { font-size: 1.3rem; }
    .panel { padding: 14px; }
    .row { grid-template-columns: 1fr; }
    textarea, input[type="text"], input[type="number"] {
      font-size: 16px;
      min-height: 44px;
    }
    textarea { min-height: 110px; }
    .check { min-height: 44px; margin-top: 4px; }
    .check input { width: 20px; height: 20px; }
    .out-head { flex-direction: column; align-items: stretch; gap: 10px; }
    #copy { width: 100%; min-height: 44px; font-size: 1rem; }
    pre { font-size: .8rem; max-height: 200px; }
  }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: .92rem; font-weight: 400; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .out-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .out-head span { font-weight: 600; font-size: .9rem; }
  pre {
    margin: 0;
    background: var(--code-bg);
    color: var(--code-text);
    border-radius: 6px;
    padding: 14px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .82rem;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 260px;
    overflow: auto;
  }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border: 0;
    border-radius: 6px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .status { min-height: 1.5em; margin: 10px 0 0; font-size: .9rem; color: var(--accent); }
  .status.err { color: #dc2626; }
  .note { color: var(--muted); font-size: .85rem; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>aria2 下载命令生成器</h1>
  <p class="sub">粘贴下载链接,自动生成命令并复制到剪贴板。</p>

  <div class="panel">
    <label for="url">下载链接</label>
    <textarea id="url" placeholder="在这里粘贴链接" autofocus spellcheck="false"></textarea>

    <div class="field">
      <label for="dir">保存目录(可选)</label>
      <input type="text" id="dir" placeholder="例如 ~/Downloads 或 /data/videos" spellcheck="false" autocapitalize="off" autocomplete="off">
    </div>

    <div class="row">
      <div>
        <label for="name">保存文件名</label>
        <input type="text" id="name" placeholder="自动识别,可手动修改">
      </div>
      <div>
        <label for="conn">连接数(1–16)</label>
        <input type="number" id="conn" min="1" max="16" value="16">
      </div>
    </div>

    <label class="check"><input type="checkbox" id="ua" checked> 添加浏览器 User-Agent</label>
    <label class="check"><input type="checkbox" id="ipv6" checked> 禁用 IPv6</label>
    <label class="check"><input type="checkbox" id="auto" checked> 粘贴后自动复制</label>
  </div>

  <div class="panel">
    <div class="out-head">
      <span>下载命令</span>
      <button id="copy" disabled>复制命令</button>
    </div>
    <pre id="out">等待粘贴链接…</pre>
    <p class="status" id="status" role="status"></p>
  </div>

  <p class="note">需要先安装:sudo apt install aria2。直链有时效,过期后请重新获取。目录不存在时 aria2 会自动创建。</p>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var urlEl = $('url'), nameEl = $('name'), connEl = $('conn'), dirEl = $('dir');
  var uaEl = $('ua'), ipv6El = $('ipv6'), autoEl = $('auto');
  var out = $('out'), copyBtn = $('copy'), statusEl = $('status');
  var nameTouched = false;
  var command = '';

  function shq(s) {
    // single-quote for bash, safe for & ? $ etc.
    return "'" + s.replace(/'/g, "'\\''") + "'";
  }

  function shqPath(p) {
    // keep a leading ~ unquoted so the shell expands it; quote the rest
    if (p === '~') return '~';
    if (p.indexOf('~/') === 0) {
      var rest = p.slice(2);
      return rest ? '~/' + shq(rest) : '~/';
    }
    return shq(p);
  }

  function guessName(u) {
    try {
      var url = new URL(u);
      var fn = url.searchParams.get('filename') || url.searchParams.get('fn');
      if (fn) return fn;
      var last = decodeURIComponent(url.pathname.split('/').filter(Boolean).pop() || '');
      if (/\.[A-Za-z0-9]{2,5}$/.test(last)) return last;
      var m = url.pathname.match(/\/fext\/([A-Za-z0-9]+)/);
      if (m) return 'video.' + m[1];
    } catch (e) {}
    return 'download';
  }

  function build() {
    var u = urlEl.value.trim();
    if (!u) {
      command = '';
      out.textContent = '等待粘贴链接…';
      copyBtn.disabled = true;
      return false;
    }
    if (!/^(https?|ftp):\/\//i.test(u)) {
      command = '';
      out.textContent = '链接需要以 http://、https:// 或 ftp:// 开头';
      copyBtn.disabled = true;
      return false;
    }
    if (!nameTouched) nameEl.value = guessName(u);

    var x = Math.min(16, Math.max(1, parseInt(connEl.value, 10) || 16));
    var parts = ['aria2c', '-x ' + x, '-s ' + x, '-k 1M', '--min-split-size=1M',
                 '--file-allocation=none', '-c'];
    if (ipv6El.checked) parts.push('--disable-ipv6=true');
    if (uaEl.checked) parts.push('--user-agent=' + shq('Mozilla/5.0'));
    var dir = dirEl.value.trim();
    if (dir) parts.push('-d ' + shqPath(dir));
    var fn = nameEl.value.trim();
    if (fn) parts.push('-o ' + shq(fn));
    parts.push(shq(u));

    command = parts.join(' ');
    out.textContent = command;
    copyBtn.disabled = false;
    return true;
  }

  function say(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }

  function copy() {
    if (!command) return;
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = command;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok ? say('已复制到剪贴板') : say('自动复制失败,请手动选中上方命令复制', true);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(command).then(
        function () { say('已复制到剪贴板'); },
        fallback
      );
    } else {
      fallback();
    }
  }

  urlEl.addEventListener('input', function () {
    say('');
    if (build() && autoEl.checked) copy();
  });
  nameEl.addEventListener('input', function () { nameTouched = true; build(); });
  [connEl, uaEl, ipv6El, dirEl].forEach(function (el) {
    el.addEventListener('input', function () { say(''); build(); });
  });
  copyBtn.addEventListener('click', copy);
})();
</script>
</body>
</html>
